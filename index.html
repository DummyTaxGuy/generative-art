<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom — Generative Art Toy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; cursor: crosshair; }
  #toolbar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
    padding: 10px 20px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
    z-index: 10;
  }
  #toolbar button, #toolbar label {
    color: #ccc; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  #toolbar button:hover, #toolbar label:hover { background: rgba(255,255,255,0.15); color: #fff; }
  #toolbar select {
    background: rgba(255,255,255,0.06); color: #ccc; border: 1px solid rgba(255,255,255,0.12);
    padding: 6px 10px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  #toolbar select option { background: #1a1a2e; }
  .hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: rgba(255,255,255,0.25); font-size: 18px; pointer-events: none;
    transition: opacity 1s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Click & drag to bloom</div>
<div id="toolbar">
  <select id="palette" title="Color palette">
    <option value="aurora">Aurora</option>
    <option value="sunset">Sunset</option>
    <option value="ocean">Ocean</option>
    <option value="neon">Neon</option>
    <option value="pastel">Pastel</option>
  </select>
  <select id="shape" title="Shape">
    <option value="circles">Circles</option>
    <option value="rings">Rings</option>
    <option value="stars">Stars</option>
    <option value="petals">Petals</option>
  </select>
  <button id="clear">Clear</button>
  <button id="save">Save PNG</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const palettes = {
  aurora:  ['#00f5d4','#00bbf9','#9b5de5','#f15bb5','#fee440'],
  sunset:  ['#ff6b6b','#ffa36b','#ffd93d','#ff6b8a','#c44dff'],
  ocean:   ['#0077b6','#00b4d8','#90e0ef','#48cae4','#ade8f4'],
  neon:    ['#ff00ff','#00ffff','#ff0080','#80ff00','#ffff00'],
  pastel:  ['#ffd6e0','#c1fba4','#a0c4ff','#ffc6ff','#fdffb6'],
};

const particles = [];
let mouseDown = false;
let spawnTimer = 0;

class Particle {
  constructor(x, y) {
    const pal = palettes[document.getElementById('palette').value];
    this.x = x;
    this.y = y;
    this.color = pal[Math.floor(Math.random() * pal.length)];
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 0.5 + Math.random() * 2.5;
    this.spin = (Math.random() - 0.5) * 0.08;
    this.size = 2 + Math.random() * 6;
    this.maxSize = this.size + 10 + Math.random() * 25;
    this.growRate = 0.15 + Math.random() * 0.3;
    this.alpha = 1;
    this.decay = 0.002 + Math.random() * 0.004;
    this.shape = document.getElementById('shape').value;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.05;
  }

  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.angle += this.spin;
    this.speed *= 0.995;
    if (this.size < this.maxSize) this.size += this.growRate;
    this.alpha -= this.decay;
    this.rotation += this.rotSpeed;
    return this.alpha > 0;
  }

  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    const r = parseInt(this.color.slice(1,3),16);
    const g = parseInt(this.color.slice(3,5),16);
    const b = parseInt(this.color.slice(5,7),16);

    if (this.shape === 'circles') {
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
      grad.addColorStop(0, `rgba(${r},${g},${b},${this.alpha})`);
      grad.addColorStop(0.5, `rgba(${r},${g},${b},${this.alpha * 0.4})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, this.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.shape === 'rings') {
      ctx.strokeStyle = `rgba(${r},${g},${b},${this.alpha * 0.7})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, this.size, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.shape === 'stars') {
      ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha * 0.8})`;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
        const outerX = Math.cos(a) * this.size;
        const outerY = Math.sin(a) * this.size;
        const innerA = a + Math.PI / 5;
        const innerX = Math.cos(innerA) * this.size * 0.4;
        const innerY = Math.sin(innerA) * this.size * 0.4;
        if (i === 0) ctx.moveTo(outerX, outerY);
        else ctx.lineTo(outerX, outerY);
        ctx.lineTo(innerX, innerY);
      }
      ctx.closePath();
      ctx.fill();
    } else if (this.shape === 'petals') {
      ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha * 0.6})`;
      for (let i = 0; i < 6; i++) {
        ctx.save();
        ctx.rotate((i * Math.PI) / 3);
        ctx.beginPath();
        ctx.ellipse(0, -this.size * 0.5, this.size * 0.3, this.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }
}

function spawn(x, y, count = 5) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(
      x + (Math.random() - 0.5) * 20,
      y + (Math.random() - 0.5) * 20
    ));
  }
}

function animate() {
  ctx.fillStyle = 'rgba(10, 10, 15, 0.03)';
  ctx.fillRect(0, 0, W, H);

  for (let i = particles.length - 1; i >= 0; i--) {
    if (!particles[i].update()) {
      particles.splice(i, 1);
    } else {
      particles[i].draw();
    }
  }
  requestAnimationFrame(animate);
}

canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  hint.style.opacity = '0';
  spawn(e.clientX, e.clientY, 12);
});
canvas.addEventListener('mouseup', () => mouseDown = false);
canvas.addEventListener('mouseleave', () => mouseDown = false);
canvas.addEventListener('mousemove', (e) => {
  if (!mouseDown) return;
  spawnTimer++;
  if (spawnTimer % 2 === 0) spawn(e.clientX, e.clientY, 3);
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  hint.style.opacity = '0';
  const t = e.touches[0];
  spawn(t.clientX, t.clientY, 12);
}, { passive: false });
canvas.addEventListener('touchend', () => mouseDown = false);
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  spawnTimer++;
  if (spawnTimer % 2 === 0) spawn(t.clientX, t.clientY, 3);
}, { passive: false });

document.getElementById('clear').addEventListener('click', () => {
  particles.length = 0;
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
});

document.getElementById('save').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'bloom-art.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

animate();
</script>
</body>
</html>
